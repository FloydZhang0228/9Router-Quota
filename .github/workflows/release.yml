name: Release

# 推 v 开头的 tag（如 v0.1.0）时触发：打包 vsix 并发布成 GitHub Release 附件
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # core 是 workspace 内部包，入口指向 dist/index.js；干净环境里必须先构建它，
      # 否则扩展打包时解析不到 @9router-quota/core（本地因残留旧 dist 而侥幸通过）。
      - name: Build core package
        run: npm run build -w packages/core

      - name: Package vsix
        run: cd packages/vscode-extension && npx @vscode/vsce package --no-dependencies

      - name: Create GitHub Release and upload vsix
        uses: softprops/action-gh-release@v2
        with:
          files: packages/vscode-extension/*.vsix
          generate_release_notes: true
