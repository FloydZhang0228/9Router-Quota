name: Release

# 推 v 开头的 tag（如 v0.1.0）时触发：打包 vsix 并发布成 GitHub Release 附件
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # core 是 workspace 内部包，入口指向 dist/index.js；干净环境里必须先构建它，
      # 否则扩展打包时解析不到 @9router-quota/core（本地因残留旧 dist 而侥幸通过）。
      - name: Build core package
        run: npm run build -w packages/core

      # VSIX 版本来自扩展 package.json，而不是 Git tag。CI 在临时工作区把 v 后面的 SemVer
      # 写进 manifest，不提交、不回推；因此 v0.2.0 永远产出 9router-quota-0.2.0.vsix。
      - name: Sync extension version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME (expected v<semver>, e.g. v0.2.0)" >&2
            exit 1
          fi
          npm version "$VERSION" --workspace=9router-quota --no-git-tag-version

      # 走 npm run package 而不是直接调 vsce：那个脚本会先生成截图内联成 data URI 的
      # README.packaged.md，并带上 --readme-path / --no-rewrite-relative-links
      # （原因见 esbuild.js 里 buildPackagedReadme 的注释）。直接调 vsce 打出来的包，
      # 扩展详情页的截图会全部裂图。
      - name: Package vsix
        shell: bash
        run: |
          cd packages/vscode-extension
          npm run package
          test -f "9router-quota-${GITHUB_REF_NAME#v}.vsix"

      - name: Create GitHub Release and upload vsix
        uses: softprops/action-gh-release@v2
        with:
          files: packages/vscode-extension/*.vsix
          generate_release_notes: true
