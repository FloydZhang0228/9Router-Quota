name: Release

#推v开头的tag（如v0.1.0）时触发：打包vsix并发布成GitHub Release附件
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      #core是workspace内部包，入口指向dist/index.js；干净环境里必须先构建它，
      #否则扩展打包时解析不到 @9router-quota/core（本地因残留旧dist而侥幸通过）。
      - name: Build core package
        run: npm run build -w packages/core

      #版本来自各扩展package.json，而不是Git tag。CI在临时工作区把v后面的SemVer
      #写进manifest，不提交、不回推；chromium包的manifest.json与package.json必须
      #同步改（check-assets.js强制两者一致，漏改一个打包就会失败）。
      - name: Sync extension versions from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME (expected v<semver>, e.g. v0.2.0)" >&2
            exit 1
          fi
          npm version "$VERSION" --workspace=9router-quota --no-git-tag-version
          npm version "$VERSION" --workspace=9router-quota-chromium --no-git-tag-version
          node -e "const fs=require('fs');const f='packages/chromium-extension/manifest.json';const m=JSON.parse(fs.readFileSync(f));m.version='$VERSION';fs.writeFileSync(f,JSON.stringify(m,null,2)+'\n')"

      #走npm run package而不是直接调vsce：那个脚本带上了 --baseImagesUrl，把README
      #里的相对截图路径重写成raw.githubusercontent.com绝对地址。vsce默认按仓库根解析
      #相对路径，而图片在packages/vscode-extension/ 下，不给这个前缀会全部裂图。
      - name: Package vsix
        shell: bash
        run: |
          cd packages/vscode-extension
          npm run package
          test -f "9router-quota-${GITHUB_REF_NAME#v}.vsix"

      #chromium扩展没有vsce那样的官方打包工具，zip.js只收集运行时文件
      #（manifest/popup/dist/images），上架应用店或手动加载都用它。
      - name: Package chromium extension
        shell: bash
        run: |
          cd packages/chromium-extension
          npm run compile
          npm run package
          test -f "9router-quota-chromium-${GITHUB_REF_NAME#v}.zip"

      #小程序产物是“导入微信开发者工具”的工程目录zip，不是应用商店安装包——
      #上架需开发者工具登录+提审，CI替不了最后一步。
      - name: Package mini-program
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd packages/miniprogram
          npm run build:mp-weixin
          cd dist/build/mp-weixin
          zip -r "../../../../../9router-quota-mp-weixin-${VERSION}.zip" .
          test -f "../../../9router-quota-mp-weixin-${VERSION}.zip"

      - name: Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/vscode-extension/*.vsix
            packages/chromium-extension/*.zip
            packages/miniprogram/9router-quota-mp-*.zip
          generate_release_notes: true
