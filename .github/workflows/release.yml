name: Release

# 推 v 开头的 tag（如 v0.1.0）时触发：打包 vsix 并发布成 GitHub Release 附件
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # core 是 workspace 内部包，入口指向 dist/index.js；干净环境里必须先构建它，
      # 否则扩展打包时解析不到 @9router-quota/core（本地因残留旧 dist 而侥幸通过）。
      - name: Build core package
        run: npm run build -w packages/core

      # 版本来自各扩展 package.json，而不是 Git tag。CI 在临时工作区把 v 后面的 SemVer
      # 写进 manifest，不提交、不回推；chrome 包的 manifest.json 与 package.json 必须
      # 同步改（check-assets.js 强制两者一致，漏改一个打包就会失败）。
      - name: Sync extension versions from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME (expected v<semver>, e.g. v0.2.0)" >&2
            exit 1
          fi
          npm version "$VERSION" --workspace=9router-quota --no-git-tag-version
          npm version "$VERSION" --workspace=9router-quota-chrome --no-git-tag-version
          node -e "const fs=require('fs');const f='packages/chrome-extension/manifest.json';const m=JSON.parse(fs.readFileSync(f));m.version='$VERSION';fs.writeFileSync(f,JSON.stringify(m,null,2)+'\n')"

      # 走 npm run package 而不是直接调 vsce：那个脚本带上了 --baseImagesUrl，把 README
      # 里的相对截图路径重写成 raw.githubusercontent.com 绝对地址。vsce 默认按仓库根解析
      # 相对路径，而图片在 packages/vscode-extension/ 下，不给这个前缀会全部裂图。
      - name: Package vsix
        shell: bash
        run: |
          cd packages/vscode-extension
          npm run package
          test -f "9router-quota-${GITHUB_REF_NAME#v}.vsix"

      # chromium 扩展没有 vsce 那样的官方打包工具，zip.js 只收集运行时文件
      # （manifest/popup/dist/images），上架应用店或手动加载都用它。
      - name: Package chromium extension
        shell: bash
        run: |
          cd packages/chrome-extension
          npm run compile
          npm run package
          test -f "9router-quota-chromium-${GITHUB_REF_NAME#v}.zip"

      - name: Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/vscode-extension/*.vsix
            packages/chrome-extension/*.zip
          generate_release_notes: true
